name: .NET Core Build App

on:
  push:
    branches: [ master , dev , dev_*]
  pull_request:
    branches: [ master , dev ]

jobs:
  build:
    # Aplikaci můžeme kompilovat na Ubuntu, Avalonia je multiplatformní
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      # TADY UPRAV NÁZEV: Zadej cestu ke svému hlavnímu .sln souboru
      run: dotnet restore DartsCounter.sln

    - name: Build Solution
      # Zkompilujeme celou aplikaci v Release módu (jako pro produkci)
      # TADY UPRAV NÁZEV: Zadej cestu ke svému hlavnímu .sln souboru
      run: dotnet build DartsCounter.sln --configuration Release --no-restore
