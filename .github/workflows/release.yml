name: Vydat novou verzi

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalace .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kompilace pro Windows
        run: dotnet publish DesktopUI/DesktopUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-win

      - name: Instalace WiX Toolset v4
        run: dotnet tool install --global wix --version 4.0.5

      - name: Sestavení MSI instalátoru
        run: wix build installer.wxs -o DartsCounter.msi

      - name: Nahrát soubor do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: DartsCounter.msi

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalace .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kompilace pro macOS
        run: dotnet publish DesktopUI/DesktopUI.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o DartsCounter.app/Contents/MacOS

      - name: Vytvoření DMG obrazu
        run: hdiutil create -volname "DartsCounter" -srcfolder DartsCounter.app -ov -format UDZO DartsCounter.dmg

      - name: Nahrát soubor do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: DartsCounter.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalace .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kompilace pro Linux
        run: dotnet publish DesktopUI/DesktopUI.csproj -c Release -r win-x64 --self-contained true -o publish-win

      - name: Příprava struktury pro AppImage
        run: |
          if [ -f "AppDir/usr/bin/DesktopUI" ]; then mv AppDir/usr/bin/DesktopUI AppDir/usr/bin/DartsCounter; fi
          
          chmod +x AppDir/usr/bin/DartsCounter
          
          echo '#!/bin/sh' > AppDir/AppRun
          echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> AppDir/AppRun
          echo 'exec "${HERE}/usr/bin/DartsCounter" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun
          
          echo "[Desktop Entry]
          Name=DartsCounter
          Exec=DartsCounter
          Icon=DartsCounter
          Type=Application
          Categories=Game;" > AppDir/DartsCounter.desktop
          
          cp DesktopUI/Assets/IcoFiles/Darts.ico AppDir/DartsCounter.png 

      - name: Vytvoření AppImage
        run: |
          wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir DartsCounter.AppImage

      - name: Nahrát soubor do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: DartsCounter.AppImage